#- debug:
#    var: arp_settings[item].value
##    var: "{{ arp_settings[item.item] }}"
#  with_items: "{{ arp_settings }}"


- name: get describo-related settings
  shell: "{{ payara_dir }}/bin/asadmin list-jvm-options | grep {{ item }}= | sed 's/.*=//'"
  register: current_arp_settings
  changed_when: false
  with_items: "{{ arp_settings }}"

#- debug:
#    var: item.stdout
#  with_items: "{{ current_arp_settings.results }}"

- name: calculate changed_arp_settings
  set_fact:
    changed_arp_settings: "{{ (arp_settings[item.item].value == item.stdout) |
                              ternary(changed_arp_settings,
                                      changed_arp_settings + [ {'name': item.item, 'value': item.stdout } ] )
                           }}"
  with_items: "{{ current_arp_settings.results }}"
  vars:
    changed_arp_settings: []

#- debug:
#    var: changed_arp_settings

- name: delete changed describo-related settings
  command: "{{ payara_dir }}/bin/asadmin delete-jvm-options \"-D{{ item.name }}={{ item.value | replace(':','\\:') }}\"" 
  with_items: "{{ changed_arp_settings }}"

#- debug:
#    var: changed_arp_settings

- name: configure describo-related settings
  command: "{{ payara_dir }}/bin/asadmin create-jvm-options \"-D{{ item.name }}={{ arp_settings[item.name].value | replace(':','\\:') }}\"" 
  with_items: "{{ changed_arp_settings }}"

- name: set cedar key
  uri:
    url: http://localhost:8080/api/admin/arp/setCedarKey
    method: POST
    body: '{"userIdentifier": "dataverseAdmin", "cedarKey": "{{ cedar.key }}"}'
    body_format: json
    status_code: 200

- name: settings set by dataverse api
  set_fact:
    arp_api_calculated_settings:
     - name: arp.cedar.domain
       value: "{{ cedar.domain }}"
     - name: arp.aroma.address
       value: https://{{ site_fqdn }}/aroma/
     - name: arp.solr.updater.address
       value: http://localhost:{{ solr_updater.port }}
     - name: arp.rocrate.previewgenerator.address
       value: http://localhost:8985
     - name: arp.w3id.base
       value: "{{ cedar.w3id }}"

- name: set settings by dataverse api
  uri:
    method: PUT
    url: http://localhost:8080/api/admin/settings/{{ item.name }}
    body: "{{ item.value }}"
    status_code: 200
  with_items: "{{ arp_api_settings + arp_api_calculated_settings }}"
