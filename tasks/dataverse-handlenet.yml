
- name: set IndependentHandleService
  uri:
    url: "{{ dataverse.api.location }}/admin/settings/:IndependentHandleService"
    method: PUT
    body: "{{ dataverse.handlenet.independenthandleservice }}"
    body_format: raw
  retries: 10
  delay: 10

- name: set HandleAuthHandle
  uri:
    url: "{{ dataverse.api.location }}/admin/settings/:HandleAuthHandle"
    method: PUT
    body: "{{ dataverse.handlenet.handleauthhandle }}"
    body_format: raw
  when:
   - dataverse.handlenet.handleauthhandle is defined

- name: copy dataverse.handlenet.admcredfile
  copy:
    src: "{{ dataverse.handlenet.admcredfile_source }}"
    dest: "{{ dataverse.handlenet.admcredfile }}"
  when:
   - dataverse.handlenet.admcredfile is defined

- name: get dataverse.handlenet.admcredfile value
  shell: "{{ payara_dir }}/bin/asadmin list-jvm-options | grep dataverse.pid.handlenet.key.path="
  register: admcredfile_value
  failed_when: false
  changed_when: false

- name: delete dataverse.handlenet.admcredfile if changed
  shell: "{{ payara_dir }}/bin/asadmin delete-jvm-options '{{ admcredfile_value.stdout | trim }}'"
  when: ( dataverse.handlenet.admcredfile is defined and ( admcredfile_value.stdout | trim ) != '-Ddataverse.pid.handlenet.key.path='+dataverse.handlenet.admcredfile ) or ( dataverse.handlenet.admcredfile is not defined and ( admcredfile_value.stdout | trim ) != '' )

- name: set dataverse.handlenet.admcredfile if changed
  shell: "{{ payara_dir }}/bin/asadmin create-jvm-options '-Ddataverse.pid.handlenet.key.path={{ dataverse.handlenet.admcredfile }}'"
  when:
   - dataverse.handlenet.admcredfile is defined
   - ( admcredfile_value.stdout | trim ) != '-Ddataverse.pid.handlenet.key.path='+dataverse.handlenet.admcredfile

- name: get dataverse.handlenet.admprivphrase value
  shell: "{{ payara_dir }}/bin/asadmin list-jvm-options | grep dataverse.pid.handlenet.key.passphrase="
  register: admprivphrase_value
  failed_when: false
  changed_when: false

- name: set dataverse.pid.handlenet.key.passphrase if set and changed
  shell: "{{ payara_dir }}/bin/asadmin delete-jvm-options '{{ admprivphrase_value.stdout | trim }}' ;
          {{ payara_dir }}/bin/asadmin create-jvm-options '-Ddataverse.pid.handlenet.key.passphrase={{ dataverse.handlenet.admprivphrase }}'"
  when:
   - dataverse.handlenet.admprivphrase is defined
   - ( admprivphrase_value.stdout | trim ) != '-Ddataverse.pid.handlenet.key.passphrase='+dataverse.handlenet.admprivphrase

- name: get dataverse.pid.handlenet.index value
  shell: "{{ payara_dir }}/bin/asadmin list-jvm-options | grep dataverse.pid.handlenet.index="
  register: index_value
  failed_when: false
  changed_when: false

- name: set dataverse.pid.handlenet.index if set and changed
  shell: "{{ payara_dir }}/bin/asadmin create-jvm-options '{{ index_value.stdout | trim }}' ;
          {{ payara_dir }}/bin/asadmin create-jvm-options '-Ddataverse.pid.handlenet.index={{ dataverse.handlenet.index }}'"
  when:
   - dataverse.handlenet.index is defined
   - ( index_value.stdout | trim ) != '-Ddataverse.pid.handlenet.index='+dataverse.handlenet.index
