- name: get dataverse user uid
  getent:
    database: passwd
    key: '{{ dataverse.payara.user }}'
- ansible.builtin.debug:
    var: ansible_facts.getent_passwd['dataverse']

- name: create fstab entries
  mount:
    src: "s3fs#{{ item.bucket_name }}"
    path: "{{ item.mapped_directory }}"
    fstype: fuse
    opts: "_netdev,allow_other,umask=227,uid={{ ansible_facts.getent_passwd['dataverse'][1] }},gid={{ ansible_facts.getent_passwd['dataverse'][2] }},use_path_request_style,profile={{ item.storage_driver_id }},url={{ item.custom_endpoint_url }}"
    state: mounted
  when: item.mapped_directory is defined and item.mapped_directory != ''
  with_items: '{{ s3 }}'

- name: set s3 storage mapping if configured
  shell: 'asadmin-create-or-replace-option.sh "dataverse.files.{{ item.storage_driver_id }}.directory" "{{ item.mapped_directory }}"'
  when: item.mapped_directory is defined and item.mapped_directory != ''
  with_items: '{{ s3 }}'
